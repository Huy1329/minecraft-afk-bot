
name: Noob SMP AFK Bot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  afk:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run bot
        env:
          AUTHME_PASSWORD: ${{ secrets.AUTHME_PASSWORD }}
        run: npm start
