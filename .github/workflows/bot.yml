
name: Restart Noob SMP AFK Bot

on:
  workflow_run:
    workflows:
      - Noob SMP AFK Bot
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  restart:
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest

    steps:
      - name: Wait before restarting
        run: sleep 30

      - name: Start bot again
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh workflow run "Noob SMP AFK Bot" \
            --repo "$REPO" \
            --ref "$BRANCH"
